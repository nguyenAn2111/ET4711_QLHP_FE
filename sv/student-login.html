<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo giao diện sinh viên - Đăng nhập</title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/student-login.css" />
</head>
<body>
  <div class="student-login-page">
    <header class="student-login-header">
      <h1>TRƯỜNG ĐẠI HỌC</h1>
    </header>

    <main class="student-login-main">
      <div class="student-login-card">
        <h2>ĐĂNG NHẬP SINH VIÊN</h2>

        <form id="studentLoginForm">
          <div class="form-group">
            <label for="studentUsername">Tài khoản sinh viên:</label>
            <input type="text" id="studentUsername" autocomplete="username" />
          </div>

          <div class="form-group">
            <label for="studentPassword">Mật khẩu:</label>
            <input type="password" id="studentPassword" autocomplete="current-password" />
          </div>

          <button type="submit" class="login-btn">Đăng nhập</button>
          <p id="studentLoginMessage" class="login-message"></p>
        </form>

        <div class="login-note">
          Tài khoản mẫu: <strong>sv</strong> — Mật khẩu mẫu: <strong>sv</strong>
        </div>
      </div>
    </main>

    <footer class="student-login-footer">
      <div>© 2025 Trường Đại Học • Cổng đăng ký học phần sinh viên</div>
      <div>Phiên bản mô phỏng</div>
    </footer>
  </div>

  <script src="assets/js/student-login.js"></script>
</body>
</html>
